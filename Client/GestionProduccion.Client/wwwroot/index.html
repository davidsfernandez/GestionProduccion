<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GestionProduccion.Client</title>
    <base href="/" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/adminkit.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/custom.css" />
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" />
    <link href="GestionProduccion.Client.styles.css" rel="stylesheet" />
    
    <!-- Flatpickr for elegant calendars -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">
    
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // --- Premium Serona Audio Engine (Offline/Native) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        window.playUISound = (type) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            switch(type) {
                case 'success':
                    // Elegant "Ta-da" chime
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'error':
                    // Soft low warning
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'notify':
                    // Elegant subtle "ding"
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'action':
                    // Minimal click
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    gain.gain.setValueAtTime(0.02, now);
                    gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
            }
        };

        window.downloadCsv = (filename, content) => {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.downloadFile = (filename, contentType, content) => {
            const blob = new Blob([content], { type: contentType });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        window.downloadFileFromStream = async (fileName, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? '';
            anchorElement.click();
            anchorElement.remove();
            URL.revokeObjectURL(url);
        }

        // --- BI Charting Engine ---
        window.renderBonusChart = (report) => {
            const ctx = document.getElementById('bonusChart');
            if (!ctx) return;
            const existingChart = Chart.getChart(ctx);
            if (existingChart) existingChart.destroy();
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Produtividade', 'Qualidade', 'Prazo (Efic.)'],
                    datasets: [{
                        label: 'Desempenho Real %',
                        data: [report.productivityPercentage, 100 - report.defectPercentage, report.deadlinePerformance],
                        backgroundColor: 'rgba(0, 200, 153, 0.2)',
                        borderColor: 'rgba(0, 200, 153, 1)',
                        borderWidth: 3,
                        pointBackgroundColor: 'rgba(0, 200, 153, 1)',
                        fill: true
                    }, {
                        label: 'Meta Ideal',
                        data: [100, 100, 100],
                        backgroundColor: 'rgba(59, 125, 221, 0.05)',
                        borderColor: 'rgba(59, 125, 221, 0.3)',
                        borderDash: [5, 5],
                        borderWidth: 1,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { r: { angleLines: { display: true }, suggestedMin: 0, suggestedMax: 100, ticks: { display: false } } },
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        };

        // --- Dashboard Main Charts Engine ---
        window.seronaCharts = {
            renderRevenueChart: function(elementId, data, labels) {
                const ctx = document.getElementById(elementId);
                if (!ctx) return;
                const existingChart = Chart.getChart(ctx);
                if (existingChart) existingChart.destroy();
                
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Volume de Produção',
                            fill: true,
                            backgroundColor: 'rgba(59, 125, 221, 0.1)',
                            borderColor: 'rgba(59, 125, 221, 1)',
                            borderWidth: 3,
                            tension: 0.4,
                            data: data
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false } },
                            y: { beginAtZero: true, grid: { borderDash: [5, 5] } }
                        }
                    }
                });
            },
            renderBarChart: function(elementId, data, labels) {
                const ctx = document.getElementById(elementId);
                if (!ctx) return;
                const existingChart = Chart.getChart(ctx);
                if (existingChart) existingChart.destroy();
                
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Peças Produzidas',
                            backgroundColor: 'rgba(59, 125, 221, 0.7)',
                            hoverBackgroundColor: 'rgba(59, 125, 221, 1)',
                            borderRadius: 10,
                            data: data,
                            barPercentage: 0.4, // Bars are now thinner and elegant
                            categoryPercentage: 0.5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { 
                                grid: { display: false },
                                ticks: { font: { size: 10, family: "'Inter', sans-serif" } }
                            },
                            y: { 
                                beginAtZero: true, 
                                grid: { borderDash: [5, 5], color: 'rgba(0,0,0,0.05)' },
                                ticks: { font: { size: 10 } }
                            }
                        }
                    }
                });
            }
        };
    </script>
    <script src="js/tvDetection.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/adminkit.js?v=1.2"></script>
    
    <!-- Flatpickr for elegant calendars -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
    <script>
        window.initializeDatePicker = (element, mode) => {
            if (!element) return;
            flatpickr(element, {
                locale: "pt",
                altInput: true,
                altFormat: mode === 'month' ? "F \\de Y" : "d/m/Y",
                dateFormat: mode === 'month' ? "Y-m" : "Y-m-d",
                plugins: mode === 'month' ? [] : [], // We can add monthSelectPlugin if needed later
                onChange: function(selectedDates, dateStr) {
                    element.value = dateStr;
                    element.dispatchEvent(new Event('change', { bubbles: true }));
                }
            });
        };
    </script>
    
    <!-- Serona Charts Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/serona-charts.js?v=1.2"></script>
</body>

</html>
